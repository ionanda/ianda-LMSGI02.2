<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Gran Premio de Mónaco - Contacto</title>
  <link rel="stylesheet" href="estilos/estilos.css" />
</head>
<body>

  <header>
    <h1>Gran Premio de Mónaco de Fórmula 1</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="circuito.html">Circuito</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Solicitud de contacto y acreditación</h2>
    <p>Rellena este formulario para solicitar información sobre las entradas o pases del Gran Premio.</p>

    <img src="imagenes/monaco_paddock.jpg" alt="Vista del paddock y boxes de Mónaco" />

    <form action="mailto:correo@ejemplo.com" method="post" enctype="text/plain" onsubmit="return validarFormulario()">
    <p>
      <label for="nombre">Nombre y apellidos:</label><br />
      <input type="text" id="nombre" name="nombre" />
    </p>

    <p>
      <label for="correo">Correo electrónico:</label><br />
      <input type="email" id="correo" name="correo" />
    </p>

    <p>
      <label for="mensaje">Mensaje:</label><br />
      <textarea id="mensaje" name="mensaje" rows="4"></textarea>
    </p>

    <p>
      <input type="submit" value="Enviar formulario" />
      <input type="reset" value="Borrar datos" />
    </p>
  </form>

  <script src="funciones/funciones.js"></script>
  </main>

  <footer>
    <p>Sitio web sobre Fórmula 1 - IANDA BirtLH</p>
  </footer>

</body>
